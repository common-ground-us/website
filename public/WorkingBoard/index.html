const TIMEFRAMES = ['today','next','soon','ongoing','pending'];
const TIMEFRAME_LABELS = { today:'Today', next:'Next', soon:'Soon', ongoing:'Ongoing', pending:'Pending' };
const ACTIVE_TIMEFRAMES = ['today','next','soon','ongoing'];
const PRIORITY_LABELS = { H:'High priority', M:'Medium priority', L:'Low priority' };
const STATUS_LABELS = { not_started:'Not started', in_progress:'In progress', blocked:'Blocked', waiting_external:'Waiting external', done:'Done', archived:'Archived' };
const priOrder = p => ({H:0,M:1,L:2}[p] ?? 3);
const isBlocked = t => t.status === 'blocked' || t.status === 'waiting_external' || unmetDeps(t).length > 0;
const isArchived = t => t.status === 'archived';

// ===== HELPERS =====

const byId = id => TASKS.find(t => t.id === id);
const isDone = t => t.status === 'done';
const openTasks = () => TASKS.filter(t => !isDone(t) && t.status !== 'archived');
const doneTasks = () => TASKS.filter(isDone);
const archivedTasks = () => TASKS.filter(t => t.status === 'archived');

function unmetDeps(t) {
  return (t.depends_on || []).map(byId).filter(x => x && !isDone(x));
}

function daysAgo(dateStr) {
  if (!dateStr || dateStr === '—') return null;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

// ===== RENDERING =====

function taskCard(t, opts={}) {
  const card = document.createElement('div');
  card.className = 'card ' + t.status;
  if (isDone(t)) card.className += ' done';

  const title = document.createElement('div');
  title.className = 'card-title' + (isDone(t) ? ' done-strike' : '');
  title.textContent = t.title;
  card.appendChild(title);

  if (opts.reason) {
    const reason = document.createElement('div');
    reason.className = 'today-reason';
    reason.textContent = opts.reason;
    card.appendChild(reason);
  }

  const meta = document.createElement('div');
  meta.className = 'card-meta';

  const pri = document.createElement('span');
  pri.className = 'pri ' + t.priority;
  pri.textContent = t.priority;
  pri.title = 'Priority ' + t.priority;
  meta.appendChild(pri);

  const st = document.createElement('span');
  st.className = 'status ' + t.status;
  st.textContent = STATUS_LABELS[t.status] || t.status;
  meta.appendChild(st);

  (t.domains || []).forEach(d => {
    const p = document.createElement('span');
    p.className = 'pill domain-' + d;
    p.textContent = DOMAINS[d] || d;
    meta.appendChild(p);
  });

  if (t.added) {
    const dateInfo = document.createElement('span');
    const dAgo = daysAgo(t.added);
    dateInfo.textContent = dAgo !== null && dAgo >= 0
      ? (dAgo === 0 ? 'added today' : 'added ' + dAgo + 'd ago')
      : 'added ' + t.added;
    meta.appendChild(dateInfo);
  }

  card.appendChild(meta);

  const unmet = unmetDeps(t);
  if (unmet.length > 0 && !isDone(t)) {
    if (t.depends_on.length === unmet.length) {
      const dep = document.createElement('div');
      dep.className = 'dep-hint';
      dep.textContent = 'blocked by: ' + unmet.map(x => x.title).join(' · ');
      card.appendChild(dep);
    } else {
      const dep = document.createElement('div');
      dep.className = 'dep-progress';
      dep.textContent = (t.depends_on.length - unmet.length) + '/' + t.depends_on.length + ' prereqs done. Remaining: ' + unmet.map(x => x.title).join(' · ');
      card.appendChild(dep);
    }
  }

  if (t.notes) {
    const toggle = document.createElement('span');
    toggle.className = 'toggle-notes';
    toggle.textContent = 'notes ▸';
    const notes = document.createElement('div');
    notes.className = 'notes hidden';
    notes.textContent = t.notes;
    toggle.addEventListener('click', () => {
      const isHidden = notes.classList.toggle('hidden');
      toggle.textContent = isHidden ? 'notes ▸' : 'notes ▾';
    });
    card.appendChild(toggle);
    card.appendChild(notes);
  }

  return card;
}

function relCard(r) {
  const c = document.createElement('div');
  c.className = 'rel-card';
  const h = document.createElement('div');
  h.className = 'rel-header';
  const n = document.createElement('div');
  n.className = 'rel-name';
  n.textContent = r.name;
  const s = document.createElement('span');
  s.className = 'rel-stage ' + r.stage;
  s.textContent = r.stage;
  h.appendChild(n);
  h.appendChild(s);
  c.appendChild(h);
  const ctx = document.createElement('div');
  ctx.className = 'rel-context';
  ctx.textContent = r.context;
  c.appendChild(ctx);
  const next = document.createElement('div');
  next.className = 'rel-next';
  next.innerHTML = '<span class="rel-next-label">Next:</span> ' + escapeHtml(r.next_action) + (r.next_action_date && r.next_action_date !== 'TBD' ? ' <span class="rel-next-label">(' + escapeHtml(r.next_action_date) + ')</span>' : '');
  c.appendChild(next);
  const m = document.createElement('div');
  m.className = 'rel-meta';
  m.textContent = 'Last contact: ' + r.last_contact + ' · ' + r.last_note;
  c.appendChild(m);
  return c;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function ideaCard(i) {
  const c = document.createElement('div');
  c.className = 'idea-card';
  const t = document.createElement('div');
  t.style.fontWeight = '600';
  t.style.marginBottom = '3px';
  t.textContent = i.title;
  c.appendChild(t);
  const n = document.createElement('div');
  n.textContent = i.note;
  n.style.fontSize = '12px';
  n.style.color = '#6a5a3a';
  c.appendChild(n);
  return c;
}

// ===== VIEWS =====

function viewActive() {
  const container = document.createElement('div');
  const intro = document.createElement('p');
  intro.style.fontSize = '13px';
  intro.style.color = '#6a6a6a';
  intro.style.marginBottom = '14px';
  intro.textContent = 'Scheduled and in-progress work. Grouped by timeframe (Today at top); within each group, sorted by priority (H → M → L).';
  container.appendChild(intro);

  ACTIVE_TIMEFRAMES.forEach(tf => {
    const items = openTasks().filter(t => t.timeframe === tf);
    if (!items.length) return;
    items.sort((a, b) => priOrder(a.priority) - priOrder(b.priority));
    container.appendChild(groupHeader(TIMEFRAME_LABELS[tf], items.length));
    items.forEach(t => container.appendChild(taskCard(t)));
  });
  return container;
}

function viewPending() {
  const container = document.createElement('div');
  const intro = document.createElement('p');
  intro.style.fontSize = '13px';
  intro.style.color = '#6a6a6a';
  intro.style.marginBottom = '14px';
  intro.textContent = 'Backlog: captured but not yet scheduled. Grouped by priority; blocked items are marked with 🔒 and their blocker.';
  container.appendChild(intro);

  ['H','M','L'].forEach(p => {
    const items = openTasks().filter(t => t.timeframe === 'pending' && t.priority === p);
    if (!items.length) return;
    container.appendChild(groupHeader(PRIORITY_LABELS[p], items.length));
    items.forEach(t => container.appendChild(taskCard(t)));
  });
  return container;
}

function viewDomain() {
  const container = document.createElement('div');
  Object.keys(DOMAINS).forEach(d => {
    const items = openTasks().filter(t => (t.domains || []).includes(d));
    if (!items.length) return;
    container.appendChild(groupHeader(DOMAINS[d], items.length));
    items.forEach(t => container.appendChild(taskCard(t)));
  });
  return container;
}

function viewAll() {
  const container = document.createElement('div');

  const filters = document.createElement('div');
  filters.className = 'filters';
  filters.innerHTML = `
    <label>Domain: <select id="f-domain"><option value="">any</option>${Object.entries(DOMAINS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <label>Status: <select id="f-status"><option value="">any</option>${Object.entries(STATUS_LABELS).filter(([k]) => k !== 'done').map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <label>Priority: <select id="f-priority"><option value="">any</option><option value="H">H</option><option value="M">M</option><option value="L">L</option></select></label>
    <label>Timeframe: <select id="f-timeframe"><option value="">any</option>${TIMEFRAMES.map(tf => `<option value="${tf}">${TIMEFRAME_LABELS[tf]}</option>`).join('')}</select></label>
    <label>Sort: <select id="f-sort"><option value="timeframe">by timeframe</option><option value="priority">by priority</option><option value="added">by age</option></select></label>
  `;
  container.appendChild(filters);

  const list = document.createElement('div');
  container.appendChild(list);

  function renderList() {
    list.innerHTML = '';
    const d = document.getElementById('f-domain').value;
    const s = document.getElementById('f-status').value;
    const p = document.getElementById('f-priority').value;
    const tf = document.getElementById('f-timeframe').value;
    const sort = document.getElementById('f-sort').value;
    let items = openTasks();
    if (d) items = items.filter(t => (t.domains || []).includes(d));
    if (s) items = items.filter(t => t.status === s);
    if (p) items = items.filter(t => t.priority === p);
    if (tf) items = items.filter(t => t.timeframe === tf);
    if (sort === 'priority') items.sort((a,b) => priOrder(a.priority) - priOrder(b.priority));
    else if (sort === 'added') items.sort((a,b) => (a.added || '').localeCompare(b.added || ''));
    else items.sort((a,b) => TIMEFRAMES.indexOf(a.timeframe) - TIMEFRAMES.indexOf(b.timeframe));
    if (!items.length) {
      list.innerHTML = '<div class="empty">No tasks match these filters.</div>';
      return;
    }
    items.forEach(t => list.appendChild(taskCard(t)));
  }

  setTimeout(() => {
    ['f-domain','f-status','f-priority','f-timeframe','f-sort'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderList);
    });
    renderList();
  }, 0);

  return container;
}

function viewRelationships() {
  const container = document.createElement('div');
  const intro = document.createElement('p');
  intro.style.fontSize = '13px';
  intro.style.color = '#6a6a6a';
  intro.style.marginBottom = '14px';
  intro.textContent = 'Mini-CRM for the people Keith is actively cultivating. Sorted with active first, then initial, then cold and dormant.';
  container.appendChild(intro);
  const order = { active: 0, initial: 1, cold: 2, dormant: 3 };
  const sorted = [...RELATIONSHIPS].sort((a, b) => order[a.stage] - order[b.stage]);
  sorted.forEach(r => container.appendChild(relCard(r)));
  return container;
}

function viewIdeas() {
  const container = document.createElement('div');
  const intro = document.createElement('p');
  intro.style.fontSize = '13px';
  intro.style.color = '#6a6a6a';
  intro.style.marginBottom = '14px';
  intro.textContent = 'Parking lot — notes and ideas worth remembering that aren’t yet tasks. Promote to a task via chat when you want to activate one.';
  container.appendChild(intro);
  IDEAS.forEach(i => container.appendChild(ideaCard(i)));
  return container;
}

function viewDone() {
  const container = document.createElement('div');
  const items = [...doneTasks()].sort((a, b) => (b.done_date || '').localeCompare(a.done_date || ''));
  items.forEach(t => container.appendChild(taskCard(t)));
  return container;
}

function groupHeader(label, count) {
  const h = document.createElement('div');
  h.className = 'group-header';
  h.textContent = label;
  if (count !== undefined) {
    const c = document.createElement('span');
    c.className = 'count';
    c.textContent = '· ' + count;
    h.appendChild(c);
  }
  return h;
}

// ===== APP =====

const VIEW_FNS = { active: viewActive, pending: viewPending, domain: viewDomain, all: viewAll, relationships: viewRelationships, ideas: viewIdeas, done: viewDone };

function render(tab) {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const fn = VIEW_FNS[tab] || viewActive;
  content.appendChild(fn());

  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  try { localStorage.setItem('cg-board-tab', tab); } catch (e) {}
}

function initCounts() {
  const open = openTasks();
  document.getElementById('count-all').textContent = open.length;
  document.getElementById('count-active').textContent = open.filter(t => ACTIVE_TIMEFRAMES.includes(t.timeframe)).length;
  document.getElementById('count-pending').textContent = open.filter(t => t.timeframe === 'pending').length;
  document.getElementById('count-rel').textContent = RELATIONSHIPS.length;
  document.getElementById('count-ideas').textContent = IDEAS.length;
  document.getElementById('count-done').textContent = doneTasks().length;
}

function initHeader() {
  document.getElementById('header-meta').textContent =
    'LAUNCH SPRINT active (target 8/23) · Data as of 2026-08-24 · ' + openTasks().length + ' open · ' + doneTasks().length + ' done · ' + archivedTasks().length + ' archived · [LAUNCH] items in Today view are the priority focus this week.';
}

function initFooter() {
  const open = openTasks();
  const byTf = TIMEFRAMES.map(tf => TIMEFRAME_LABELS[tf] + ': ' + open.filter(t => t.timeframe === tf).length).join(' · ');
  document.getElementById('footer').textContent = byTf;
}

document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => render(el.dataset.tab));
});

initCounts();
initHeader();
initFooter();
let savedTab = 'active';
try { savedTab = localStorage.getItem('cg-board-tab') || 'active'; } catch (e) {}
// Migrate old tab names from prior version
if (savedTab === 'today') savedTab = 'active';
if (savedTab === 'horizon') savedTab = 'pending';
render(savedTab);
</script>
</body>
</html>

[build]
  command   = "npm run build"
  publish   = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Decap CMS: serve admin under /admin/
[[redirects]]
  from   = "/admin/*"
  to     = "/admin/index.html"
  status = 200

# PWA: always serve index.html for SPA-style nav fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
